name: Build Confessly Client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x] # Use a compatible Node.js version

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm' # Caches npm dependencies
    - name: Install dependencies
      run: npm ci # Use npm ci for clean installs in CI environments
    - name: Build Angular application
      run: npm run build -- --configuration=production # Command to build the project
